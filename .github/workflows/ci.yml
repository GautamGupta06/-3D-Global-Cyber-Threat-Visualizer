name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend Build & Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: frontend
        run: npm run build

  backend-tests:
    name: Backend API & SQLite Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Test Database & Persistence Engine
        working-directory: backend
        run: node -e "const { db, getStats } = require('./db'); console.log('DB Initialized:', getStats());"

  ml-pipeline-check:
    name: PyTorch ML Pipeline Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        working-directory: backend/ml
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate PyTorch Deep Autoencoder & Explainability
        working-directory: backend/ml
        run: python -c "from nids_autoencoder import ConceptDriftDetector; d = ConceptDriftDetector(); res = d.process_features([0.9,0.9,0.8,0.7,0.9,0.2,0.3,0.8,0.9,0.8]); print('Validation OK:', res['is_anomaly']);"
