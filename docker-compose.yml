services:
  # 🌐 3D Threat Globe React HUD (Port 5173 / 80)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped

  # ⚙️ Node.js WebSocket & SQLite Persistence Backend (Port 4000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - kafka
    restart: unless-stopped

  # 🧠 PyTorch Deep Autoencoder & Drift Stream Service
  ml-service:
    build:
      context: ./backend/ml
      dockerfile: Dockerfile
    environment:
      - BACKEND_API=http://backend:4000/api/threats
    depends_on:
      - backend
    restart: unless-stopped

  # 📨 Kafka KRaft Broker (Port 9092)
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: unless-stopped

volumes:
  sqlite-data:
  kafka-data:
